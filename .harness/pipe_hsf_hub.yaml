pipeline:
  name: Update Group Notifications
  identifier: updategroupnotifications
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  description: Deploys a pipeline that sets a notification channel on one or more Harness user groups
  tags: {
    pipeline_type: platform_management
  }
  stages:
    - stage:
        name: Create_Manage_Workspace
        identifier: Create_Manage_Workspace
        description: ""
        type: Pipeline
        spec:
          org: ${WORKSPACE_MGMT_ORG_ID}
          project: ${WORKSPACE_MGMT_PROJECT_ID}
          pipeline: ${WORKSPACE_MGMT_PIPELINE_ID}
          inputs:
            identifier: ${WORKSPACE_MGMT_PIPELINE_ID}
            variables:
              - name: RESOURCE_NAME
                type: String
                value: update_group_notifications
              - name: RESOURCE_OWNER
                type: String
                value: user:account/<+pipeline.triggeredBy.email>
              - name: RESOURCE_VARS
                type: String
                value: |-
                  {
                    "harness_platform_account":"<+account.identifier>",
                    "organization_id": "<+pipeline.variables.organization_id>",
                    "project_id": "<+pipeline.variables.project_id>",
                    "harness_api_key_secret_ref": "<+pipeline.variables.harness_api_key_secret_ref>",
                    "docker_connector_ref": "<+pipeline.variables.docker_connector_ref>",
                    "sdk_image": "<+pipeline.variables.sdk_image>",
                    "kubernetes_connector": "<+pipeline.variables.kubernetes_connector>",
                    "kubernetes_namespace": "<+pipeline.variables.kubernetes_namespace>",
                    "kubernetes_node_selectors": <+pipeline.variables.kubernetes_node_selectors>,
                    "kubernetes_override_image_connector": "<+pipeline.variables.kubernetes_override_image_connector>",
                    "kubernetes_service_account": "<+pipeline.variables.kubernetes_service_account>",
                    "workflow_organization_id": "<+pipeline.variables.workflow_organization_id>",
                    "workflow_project_id": "<+pipeline.variables.workflow_project_id>",
                    "restrict_to_user_group_membership": <+pipeline.variables.restrict_to_user_group_membership>
                  }
              - name: RESOURCE_VARS_SECRETS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS_SECRET
                type: String
                value: "{}"
              - name: GIT_REPOSITORY_BRANCH
                type: String
                value: main
              - name: GIT_REPOSITORY_CONNECTOR
                type: String
                value: <+variable.account.custom_template_library_connector>
              - name: GIT_REPOSITORY_NAME
                type: String
                value: <+variable.account.custom_template_library_repo>
              - name: GIT_REPOSITORY_PATH
                type: String
                value: group-notification-update-pipeline
              - name: IAC_PROVISIONER_TYPE
                type: String
                value: opentofu
              - name: IAC_PROVISIONER_VERSION
                type: String
                value: 1.10.0
              - name: IAC_PROVIDER_CONNECTOR
                type: String
                value: ""
              - name: INCLUDE_HARNESS_ENVS
                type: String
                value: "true"
              - name: REGISTER_IDP
                type: String
                value: "${SHOULD_USE_HARNESS_IDP}"
              # Determines if the workflow will trigger a temporary workspace that is
              # deleted upon completion. Resources will be preserved
              # Must be "true" or "false" and wrapped in quotes
              - name: IS_EPHEMERAL
                type: String
                value: "false"
              # Determines if the workflow will require an Approval before executing
              # Must be "true" or "false" and wrapped in quotes
              - name: REQUIRES_APPROVAL
                type: String
                value: "false"
              - name: WORKSPACE_ORG
                type: String
                value: Harness_Platform_Management
              - name: WORKSPACE_PROJECT
                type: String
                value: Solutions_Factory
              - name: WORKSPACE_TAGS
                type: String
                # Used to group by type the workspaces for bulk actions
                value: |-
                  {
                    "source":"custom",
                    "type":"group-notification-update-pipeline"
                  }
  # Pipeline Variables
  variables:
    ## Harness Hierarchy Setup Details
    - name: organization_id
      type: String
      description: "[Required] Provide an existing organization reference ID.  Must exist before execution"
      required: true
      value: <+input>.regex(^([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: project_id
      type: String
      description: "[Required] Provide an existing project reference ID.  Must exist before execution"
      required: true
      value: <+input>.regex(^([a-zA-Z][_a-zA-Z0-9]*)$)
    ## Pipeline Input Variables Controls
    - name: harness_api_key_secret_ref
      type: String
      description: "[Required] Reference to a Harness Secret containing a Harness Platform API Key with View and Manage permission on user groups at every scope you intend to update"
      required: true
      value: <+input>.regex(^account.([a-zA-Z][_a-zA-Z0-9]*)$|org.([a-zA-Z][_a-zA-Z0-9]*)$|([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: docker_connector_ref
      type: String
      description: "[Optional] Docker registry connector used to pull the SDK image for the Run step (an anonymous Docker Hub connector works; the image is public)"
      required: false
      value: <+input>.default(account.harnessImage)
    - name: sdk_image
      type: String
      description: "[Optional] Image with harness-platform-sdk preinstalled, used by the Run step. Pin a version tag rather than latest"
      required: false
      value: <+input>.default(harnesssolutionfactory/harness-platform-sdk:v1.1.0)
    ## Advanced Kubernetes Step Group Configuration
    - name: kubernetes_connector
      type: String
      description: "[Required] Enter the existing Kubernetes connector used by the step group's infrastructure. Must exist before execution"
      required: true
      value: <+input>.regex(^account.([a-zA-Z][_a-zA-Z0-9]*)$|org.([a-zA-Z][_a-zA-Z0-9]*)$|([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: kubernetes_namespace
      type: String
      description: "[Optional] Enter the existing Kubernetes namespace the step group's pod runs in"
      required: false
      value: <+input>.default(default)
    - name: kubernetes_node_selectors
      type: String
      description: "[Optional] Optional Kubernetes Node Selectors"
      required: false
      value: <+input>.default({})
    - name: kubernetes_override_image_connector
      type: String
      description: "[Optional] Enter an existing Container Registry connector to use which overrides the default connector Harness uses for its internal images. Must exist before execution. To not set this, ensure the value is 'skipped'"
      required: false
      value: <+input>.regex(^account.([a-zA-Z][_a-zA-Z0-9]*)$|org.([a-zA-Z][_a-zA-Z0-9]*)$|([a-zA-Z][_a-zA-Z0-9]*)$).default(skipped)
    - name: kubernetes_service_account
      type: String
      description: "[Optional] Enter a Kubernetes service account name to run the step group's pod as, overriding the namespace default. To not set this, ensure the value is 'skipped'"
      required: false
      value: <+input>.default(skipped)
    ## Operational Workflow Catalog Placement (independent of organization_id/project_id above)
    - name: workflow_organization_id
      type: String
      description: "[Optional] Organization to publish the operational IDP workflow into. Independent of organization_id above. To publish at the account level, ensure the value is 'skipped'"
      required: false
      value: <+input>.regex(^account.([a-zA-Z][_a-zA-Z0-9]*)$|org.([a-zA-Z][_a-zA-Z0-9]*)$|([a-zA-Z][_a-zA-Z0-9]*)$).default(skipped)
    - name: workflow_project_id
      type: String
      description: "[Optional] Project to publish the operational IDP workflow into. Requires workflow_organization_id to also be set. To publish at the organization (or account) level, ensure the value is 'skipped'"
      required: false
      value: <+input>.default(skipped)
    - name: restrict_to_user_group_membership
      type: String
      description: "[Optional] When true (default), the operational workflow's user group picker only lets a user pick groups they are a member of. Set to false to let a user modify any user group"
      required: false
      value: <+input>.default(true).selectOneFrom(true,false)
