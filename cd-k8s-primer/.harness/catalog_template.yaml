apiVersion: harness.io/v1
kind: Workflow
identifier: cdk8sprimer
name: CD K8s Primer
owner: group:default/harness_account_all_users
type: Deployment
metadata:
  description: Provision the enterprise Kubernetes CD building blocks - a standard rolling deploy stage template, a Dev/Test/Approval/Prod pipeline template, and the standard Helm chart connector + base values file.
  tags:
    - solutions-factory
    - harness
    - cd
    - kubernetes
    - template
spec:
  presentation:
    customTitle: CD K8s Primer
    customSubTitle: Enterprise Kubernetes CD templates, Helm connector, and base values
    customCreateButtonText: Create my template
  parameters:
    - title: Template Location
      required:
        - template_location
      properties:
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
        template_location:
          title: Template Location
          type: string
          description: Where should the Stage/Pipeline templates and Helm connector be created?
          enum:
            - Account
            - Organization
            - Project
      dependencies:
        template_location:
          oneOf:
            - properties:
                template_location:
                  enum:
                    - Account
            - properties:
                template_location:
                  enum:
                    - Organization
                org_id:
                  title: Org Identifier
                  description: Harness Organization Identifier
                  type: string
                  ui:field: HarnessOrgPicker
              required:
                - org_id
            - properties:
                template_location:
                  enum:
                    - Project
                project_id:
                  title: Project Identifier
                  description: Harness Project Identifier
                  type: string
                  ui:field: HarnessProjectPicker
                org_id:
                  title: Org Identifier
                  description: Harness Organization Identifier
                  type: string
                  ui:field: HarnessOrgPicker
              required:
                - project_id
                - org_id
    - title: Standard Helm Chart
      description: By default, the module provisions a connector and base values file for Harness' standard enterprise Helm chart. Optionally provide your own "standard helm chart" to use instead.
      properties:
        use_custom_helm_chart:
          title: Use my own standard helm chart?
          type: boolean
          default: false
      dependencies:
        use_custom_helm_chart:
          oneOf:
            - properties:
                use_custom_helm_chart:
                  enum:
                    - false
            - properties:
                use_custom_helm_chart:
                  enum:
                    - true
                helm_chart_override_url:
                  title: Helm Chart URL
                  type: string
                  description: URL of your own standard Helm chart (e.g. oci://registry.example.com/charts)
                helm_connector_username:
                  title: Connector Username
                  type: string
                  description: Optional username for the Helm chart connector. Leave blank for anonymous access.
                helm_connector_password_ref:
                  title: Connector Password Secret Reference
                  type: string
                  description: Optional secret reference (e.g. account.my_secret) for the Helm chart connector password.
                base_values_override_content:
                  title: Base Helm Values Override
                  type: string
                  description: Paste the base values.yaml content for your chart. Leave blank to keep the Harness default values.
                  ui:widget: textarea
              required:
                - helm_chart_override_url
    - title: Solutions Factory Connection
      properties:
        solutions_factory_details:
          title: Solutions Factory Details
          type: object
          description: |
            ---
            Harness URL : <+variable.account.solutions_factory_endpoint>

            Harness Account : <+account.identifier>

            Solutions Factory Org : <+variable.account.solutions_factory_org>

            Solutions Factory Project : <+variable.account.solutions_factory_project>
          required:
            - harness_account_url
            - harness_account_id
            - harness_org_id
            - harness_project_id
            - template_library_connector
            - template_library_repo
            - template_library_branch
            - template_library_directory
          properties:
            harness_account_url:
              type: string
              default: <+variable.account.solutions_factory_endpoint>
              ui:widget: hidden
            harness_account_id:
              type: string
              default: <+account.identifier>
              ui:widget: hidden
            harness_org_id:
              type: string
              default: <+variable.account.solutions_factory_org>
              ui:widget: hidden
            harness_project_id:
              type: string
              default: <+variable.account.solutions_factory_project>
              ui:widget: hidden
            template_library_connector:
              type: string
              default: <+variable.account.custom_template_library_connector>
              ui:widget: hidden
            template_library_repo:
              type: string
              default: <+variable.account.custom_template_library_repo>
              ui:widget: hidden
            template_library_branch:
              type: string
              default: main
              ui:widget: hidden
            template_library_directory:
              type: string
              default: cd-k8s-primer
              ui:widget: hidden
        solutions_factory_opts:
          title: Solutions Factory Workflow Options
          type: object
          required:
            - repo_source
            - workspace_type
          properties:
            repo_source:
              type: string
              default: custom
              ui:widget: hidden
            workspace_type:
              type: string
              default: cd-k8s-primer
              ui:widget: hidden
            is_ephemeral:
              type: string
              default: "false"
              ui:widget: hidden
            requires_approval:
              type: string
              default: "false"
              ui:widget: hidden
            use_mini_factory:
              type: string
              default: "false"
              ui:widget: hidden
  steps:
    - id: configure_workspace
      name: Configuring Harness Workspace
      action: trigger:harness-custom-pipeline
      input:
        url: ${{ parameters.solutions_factory_details.harness_account_url }}/ng/account/${{ parameters.solutions_factory_details.harness_account_id }}/all/orgs/${{ parameters.solutions_factory_details.harness_org_id }}/projects/${{ "hws_" if parameters.solutions_factory_opts.use_mini_factory=="true" else "" }}${{ parameters.org_id if parameters.solutions_factory_opts.use_mini_factory=="true" else parameters.solutions_factory_details.harness_project_id }}/pipelines/Create_and_Manage_IACM_Workspaces/pipeline-studio?storeType=INLINE
        inputset:
          GIT_REPOSITORY_CONNECTOR: ${{ parameters.solutions_factory_details.template_library_connector }}
          GIT_REPOSITORY_NAME: ${{ parameters.solutions_factory_details.template_library_repo }}
          GIT_REPOSITORY_BRANCH: ${{ parameters.solutions_factory_details.template_library_branch }}
          GIT_REPOSITORY_PATH: ${{ parameters.solutions_factory_details.template_library_directory }}
          RESOURCE_NAME: ${{ parameters.org_id + "_" if parameters.project_id else ( parameters.org_id + "_" if parameters.org_id else "") }}${{ parameters.project_id + "_" if parameters.project_id else "" }}cd_k8s_primer
          RESOURCE_OWNER: group:default/harness_account_all_users
          # YAML of Terraform variables of type 'String' mapped to their IDP parameters
          RESOURCE_VARS:
            harness_platform_account: ${{ parameters.solutions_factory_details.harness_account_id }}
            organization_id: ${{ parameters.org_id if parameters.project_id else ( parameters.org_id if parameters.org_id else "") }}
            project_id: ${{ parameters.project_id if parameters.project_id else "" }}
            helm_chart_override_url: ${{ parameters.helm_chart_override_url if parameters.use_custom_helm_chart else "" }}
            helm_connector_username: ${{ parameters.helm_connector_username if parameters.use_custom_helm_chart else "" }}
            base_values_override_content: ${{ parameters.base_values_override_content if parameters.use_custom_helm_chart else "" }}
          # YAML of Terraform variables of type 'Secret' Reference mapped to their IDP parameters
          RESOURCE_VARS_SECRETS:
            helm_connector_password_ref: ${{ parameters.helm_connector_password_ref if parameters.use_custom_helm_chart else "" }}
          # YAML of Environment variables of type 'String' mapped to their IDP parameters
          RESOURCE_VARS_ENVS: {}
          # YAML of Environment variables of type 'Secret' Reference mapped to their IDP parameters
          RESOURCE_VARS_ENVS_SECRET: {}
          INCLUDE_HARNESS_ENVS: "true"
          WORKSPACE_TAGS:
            source: ${{ parameters.solutions_factory_opts.repo_source }}
            type: ${{ parameters.solutions_factory_opts.workspace_type }}
          IS_EPHEMERAL: ${{ parameters.solutions_factory_opts.is_ephemeral }}
          REQUIRES_APPROVAL: ${{ parameters.solutions_factory_opts.requires_approval }}
        apikey: ${{ parameters.token }}
        showOutputVariables: true
  output:
    links:
      - title: Harness Workspace Configured - Execution Link
        url: ${{ steps.configure_workspace.output.PipelineUrl }}
    text:
      - title: Outputs
        content: |
          Stage Template: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.stage_template_id']}}

          Pipeline Template: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.pipeline_template_id']}}

          Helm Connector: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.helm_connector_id']}}
